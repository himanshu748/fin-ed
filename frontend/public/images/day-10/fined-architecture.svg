  <path d="M 194 370 h 40 M 214 352 v 18" stroke="#174EA6" stroke-width="3" stroke-linecap="round"/>
  <text x="214" y="383" text-anchor="middle" fill="#15233B" font-family="Arial, sans-serif" font-size="19" font-weight="700">Browser or phone</text>

  <text x="382" y="224" fill="#15233B" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">REALTIME VOICE PIPELINE</text>
