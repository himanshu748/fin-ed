<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="FinEd Saathi voice architecture">
  <title>FinEd Saathi voice architecture</title>
  <desc>A privacy-safe map of the FinEd Saathi realtime voice pipeline, its two teaching agents, and optional read-only, simulated, memory, and official tax systems.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15233B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#174EA6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F6F2E8"/>
  <rect x="56" y="48" width="1488" height="804" rx="28" fill="#FFFCF5" stroke="#15233B" stroke-width="3"/>

