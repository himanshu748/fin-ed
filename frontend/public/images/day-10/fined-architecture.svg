  <text x="1496" y="118" text-anchor="end" fill="#15233B" font-family="Arial, sans-serif" font-size="18">Education first. Private by design.</text>

  <text x="104" y="224" fill="#15233B" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">INPUT</text>
